<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Store Affiliate & WhatsApp E-Commerce</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto justify-between">
                <span class="text-2xl font-black text-indigo-600">ShopHub</span>
                <!-- Mobile Cart Button / Icon inside Header -->
                <button onclick="toggleCartModal()" class="md:hidden relative bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 flex items-center space-x-1">
                    <span>Cart</span>
                    <span id="mobileCartCount" class="bg-red-500 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <!-- Search Bar Suggest Filter -->
            <div class="w-full md:w-96">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Products search karein (e.g. Shoes, Watch)..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                </div>
            </div>

            <div class="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-end">
                <!-- Company / Brand Filter Dropdown -->
                <select id="companyFilter" onchange="filterProducts()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="all">All Brands</option>
                    <option value="Amazon">Amazon</option>
                    <option value="Flipkart">Flipkart</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Nike">Nike</option>
                    <option value="Puma">Puma</option>
                </select>

                <!-- Desktop Cart Button -->
                <button onclick="toggleCartModal()" class="hidden md:flex relative bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span>Cart</span>
                    <span id="cartCount" class="bg-red-500 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Category Selector Tabs -->
        <div class="flex space-x-3 overflow-x-auto pb-4 mb-6 scrollbar-hide">
            <button onclick="filterCategory('all')" class="cat-btn bg-indigo-600 text-white px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap transition">All Categories</button>
            <button onclick="filterCategory('electronics')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-300 transition">Electronics</button>
            <button onclick="filterCategory('clothing')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-300 transition">Clothing</button>
            <button onclick="filterCategory('footwear')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-300 transition">Footwear</button>
            <button onclick="filterCategory('groceries')" class="cat-btn bg-gray-200 text-gray-700 px-4 py-2 rounded-full text-sm font-medium whitespace-nowrap hover:bg-gray-300 transition">Groceries</button>
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products dynamic tareeke se load honge -->
        </div>
    </main>

    <!-- Cart & Checkout Modal Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-xl">
            <div>
                <div class="flex justify-between items-center border-b pb-4">
                    <h2 class="text-xl font-bold text-gray-800">Your Cart & Checkout</h2>
                    <button onclick="toggleCartModal()" class="text-gray-500 hover:text-gray-700 font-bold text-2xl">&times;</button>
                </div>
                <!-- Cart Items List -->
                <div id="cartItems" class="divide-y overflow-y-auto max-h-[60vh] my-4">
                    <p class="text-gray-500 text-sm text-center py-4">Your cart is empty.</p>
                </div>
            </div>

            <!-- Checkout Options -->
            <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between font-bold text-lg">
                    <span>Total:</span>
                    <span id="cartTotal">₹0</span>
                </div>
                <p class="text-xs text-gray-500 text-center">Order complete karne ke liye tarika chunein:</p>
                
                <!-- WhatsApp Order Button -->
                <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 flex items-center justify-center space-x-2 transition">
                    <svg class="h-5 w-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                    <span>WhatsApp Par Order Karein</span>
                </button>

                <!-- Flipkart / Affiliate Redirect Button -->
                <button onclick="checkoutAffiliate()" class="w-full bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600 flex items-center justify-center space-x-2 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    <span>Direct Flipkart / Affiliate Cart</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Code -->
    <script>
        const products = [
            { id: 1, name: "Wireless Bluetooth Earbuds", category: "electronics", company: "Amazon", price: 1499, image: "https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400", affiliateLink: "https://www.amazon.in/dp/EXAMPLE" },
            { id: 2, name: "Smart Fitness Watch", category: "electronics", company: "Flipkart", price: 2999, image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400", affiliateLink: "https://www.flipkart.com/example-product" },
            { id: 3, name: "Casual Cotton T-Shirt", category: "clothing", company: "Nike", price: 699, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=400", affiliateLink: "https://www.nike.com/in/" },
            { id: 4, name: "Slim Fit Denim Jeans", category: "clothing", company: "Amazon", price: 1299, image: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=400", affiliateLink: "https://www.amazon.in/dp/EXAMPLE" },
            { id: 5, name: "Running Sports Shoes", category: "footwear", company: "Puma", price: 2499, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", affiliateLink: "https://www.flipkart.com/example-shoes" },
            { id: 6, name: "Android Smart LED TV 43 inch", category: "electronics", company: "Samsung", price: 18999, image: "https://images.unsplash.com/photo-1593359677879-a4bb92f829d1?w=400", affiliateLink: "https://www.samsung.com/in/" },
            { id: 7, name: "Organic Green Tea Pack", category: "groceries", company: "Amazon", price: 350, image: "https://images.unsplash.com/photo-1576092768241-dec231879fc3?w=400", affiliateLink: "https://www.amazon.in/dp/EXAMPLE" }
        ];

        let cart = [];
        let currentCategory = 'all';

        function renderProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (items.length === 0) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-500 py-10">Aapke search ya filter se match karta hua koi product nahi mila.</p>`;
                return;
            }

            items.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow hover:shadow-lg transition p-4 flex flex-col justify-between">
                        <div>
                            <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover rounded-lg mb-4">
                            <span class="text-xs bg-indigo-50 text-indigo-600 px-2.5 py-1 rounded-full font-semibold">${product.company}</span>
                            <h3 class="font-bold text-gray-800 mt-2 text-base">${product.name}</h3>
                            <p class="text-indigo-600 font-bold mt-1">₹${product.price}</p>
                        </div>
                        <div class="mt-4">
                            <button onclick="addToCart(${product.id})" class="w-full bg-indigo-600 text-white py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            currentCategory = category;
            
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.replace('bg-indigo-600', 'bg-gray-200');
                btn.classList.replace('text-white', 'text-gray-700');
            });
            event.target.classList.replace('bg-gray-200', 'bg-indigo-600');
            event.target.classList.replace('text-gray-700', 'text-white');

            applyFilters();
        }

        // Combined Filter Engine (Search Text + Brand + Category)
        function filterProducts() {
            applyFilters();
        }

        function applyFilters() {
            let filtered = products;
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const companyVal = document.getElementById('companyFilter').value;

            // 1. Category Filter
            if (currentCategory !== 'all') {
                filtered = filtered.filter(p => p.category === currentCategory);
            }

            // 2. Company / Brand Filter
            if (companyVal !== 'all') {
                filtered = filtered.filter(p => p.company === companyVal);
            }

            // 3. Live Search Suggest Filter
            if (searchVal !== '') {
                filtered = filtered.filter(p => p.name.toLowerCase().includes(searchVal) || p.company.toLowerCase().includes(searchVal));
            }

            renderProducts(filtered);
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            updateCartUI();
            toggleCartModal();
        }

        function updateCartUI() {
            const cartCount = document.getElementById('cartCount');
            const mobileCartCount = document.getElementById('mobileCartCount');
            const cartItems = document.getElementById('cartItems');
            const cartTotal = document.getElementById('cartTotal');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartCount.innerText = totalCount;
            mobileCartCount.innerText = totalCount;

            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="text-gray-500 text-sm text-center py-4">Your cart is empty.</p>`;
                cartTotal.innerText = '₹0';
                return;
            }

            cartItems.innerHTML = '';
            let totalPrice = 0;

            cart.forEach(item => {
                totalPrice += item.price * item.quantity;
                cartItems.innerHTML += `
                    <div class="py-3 flex justify-between items-center">
                        <div>
                            <h4 class="text-sm font-bold text-gray-800">${item.name}</h4>
                            <p class="text-xs text-gray-500">₹${item.price} x ${item.quantity}</p>
                        </div>
                        <span class="font-bold text-sm">₹${item.price * item.quantity}</span>
                    </div>
                `;
            });

            cartTotal.innerText = `₹${totalPrice}`;
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return alert("Aapki cart khali hai!");

            let message = "Namaste, mujhe ye products order karne hain:%0A%0A";
            let total = 0;

            cart.forEach(item => {
                message += `• *${item.name}* (Qty: ${item.quantity}) - ₹${item.price * item.quantity}%0A`;
                total += item.price * item.quantity;
            });

            message += `%0A*Kul Rashi (Total): ₹${total}*`;
            
            const whatsappNumber = "919876543210"; 
            window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
        }

        function checkoutAffiliate() {
            if (cart.length === 0) return alert("Aapki cart khali hai!");
            
            const targetUrl = cart[0].affiliateLink || "https://www.flipkart.com";
            window.open(targetUrl, '_blank');
        }

        // Initial Load
        renderProducts(products);
    </script>
</body>
</html>

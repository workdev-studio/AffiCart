<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AffiCart - Multi-Store Affiliate & WhatsApp E-Commerce</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3 w-full md:w-auto justify-between">
                <!-- 10 Clicks target on Logo for Admin Panel -->
                <span id="logoBtn" onclick="handleLogoClick()" class="text-2xl font-black text-indigo-600 cursor-pointer select-none" title="Click 10 times to open Admin Panel">AffiCart</span>
                
                <button onclick="toggleCartModal()" class="md:hidden relative bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 flex items-center space-x-1">
                    <span>Cart</span>
                    <span id="mobileCartCount" class="bg-red-500 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>

            <!-- Search Bar Filter -->
            <div class="w-full md:w-96">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </span>
                    <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Products search karein..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50">
                </div>
            </div>

            <div class="flex items-center space-x-4 w-full md:w-auto justify-between md:justify-end">
                <select id="companyFilter" onchange="filterProducts()" class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <option value="all">All Brands</option>
                    <option value="Amazon">Amazon</option>
                    <option value="Flipkart">Flipkart</option>
                    <option value="Samsung">Samsung</option>
                    <option value="Nike">Nike</option>
                    <option value="Puma">Puma</option>
                </select>

                <button onclick="toggleCartModal()" class="hidden md:flex relative bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span>Cart</span>
                    <span id="cartCount" class="bg-red-500 text-xs px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        
        <!-- Hero Offer Banner Slider -->
        <div class="relative w-full h-44 sm:h-64 md:h-80 rounded-2xl overflow-hidden shadow-lg mb-8 bg-gray-200">
            <div id="bannerSlider" class="flex transition-transform duration-700 ease-in-out h-full">
                <!-- Dynamic Banners Injected via JS -->
            </div>
            <!-- Slider Indicators -->
            <div id="sliderDots" class="absolute bottom-3 left-0 right-0 flex justify-center space-x-2">
                <!-- Dynamic Dots -->
            </div>
        </div>

        <!-- Category Selector Tabs (Dynamic) -->
        <div id="categoryContainer" class="flex space-x-3 overflow-x-auto pb-4 mb-6 scrollbar-hide">
            <!-- Dynamic Category Buttons -->
        </div>

        <!-- Product Grid -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic Products -->
        </div>
    </main>

    <!-- 1. Admin Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex justify-center items-center">
        <div class="bg-white w-full max-w-sm p-6 rounded-xl shadow-2xl">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-lg text-gray-800">Admin Login</h3>
                <button onclick="closeLoginModal()" class="text-gray-500 font-bold text-xl">&times;</button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Username</label>
                    <input type="text" id="adminUser" placeholder="Enter username" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
                    <input type="password" id="adminPass" placeholder="Enter password" class="w-full border px-3 py-2 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button onclick="verifyAdminLogin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Login</button>
            </div>
        </div>
    </div>

    <!-- 2. Admin JSON Dashboard Modal -->
    <div id="adminModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex justify-center items-center">
        <div class="bg-white w-full max-w-2xl p-6 rounded-xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold text-lg text-gray-800">Admin Panel: JSON Manager (Banners, Categories & Products)</h3>
                <button onclick="closeAdminModal()" class="text-gray-500 font-bold text-2xl">&times;</button>
            </div>
            <p class="text-xs text-gray-500 mb-2">Yahan apna poora JSON (banners, categories, products) paste karein:</p>
            <textarea id="jsonInput" class="w-full h-64 border p-3 font-mono text-xs rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
            
            <div class="flex justify-end space-x-3 mt-4">
                <button onclick="closeAdminModal()" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg text-sm font-semibold hover:bg-gray-400">Cancel & Logout</button>
                <button onclick="saveJsonData()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">Save & Update Store</button>
            </div>
        </div>
    </div>

    <!-- Cart & Checkout Drawer -->
    <div id="cartModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex justify-end">
        <div class="bg-white w-full max-w-md h-full p-6 flex flex-col justify-between shadow-xl">
            <div>
                <div class="flex justify-between items-center border-b pb-4">
                    <h2 class="text-xl font-bold text-gray-800">Your Cart & Checkout</h2>
                    <button onclick="toggleCartModal()" class="text-gray-500 hover:text-gray-700 font-bold text-2xl">&times;</button>
                </div>
                <div id="cartItems" class="divide-y overflow-y-auto max-h-[60vh] my-4">
                    <p class="text-gray-500 text-sm text-center py-4">Your cart is empty.</p>
                </div>
            </div>

            <div class="border-t pt-4 space-y-3">
                <div class="flex justify-between font-bold text-lg">
                    <span>Total:</span>
                    <span id="cartTotal">₹0</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-green-600 text-white py-3 rounded-lg font-semibold hover:bg-green-700 flex items-center justify-center space-x-2 transition">
                    <span>WhatsApp Par Order Karein</span>
                </button>
                <button onclick="checkoutAffiliate()" class="w-full bg-blue-500 text-white py-3 rounded-lg font-semibold hover:bg-blue-600 flex items-center justify-center space-x-2 transition">
                    <span>Direct Flipkart / Affiliate Cart</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Link External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
